name: E2E (Playwright)

on:
  pull_request:
    paths:
      - 'wp-plugin/**'
      - 'lib/**'
      - 'tests/e2e/**'
      - '.wp-env.json'
      - 'bin/dev-up.sh'
      - 'bin/dev-seed.sh'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2

      - name: Composer install (lib + wp-plugin)
        run: |
          ( cd lib && composer install --no-interaction --prefer-dist --no-progress )
          ( cd wp-plugin && composer install --no-interaction --prefer-dist --no-progress )

      - name: Boot wp-env
        run: bash bin/dev-up.sh

      - name: Install Playwright
        working-directory: tests/e2e
        run: |
          npm ci || npm install
          npx playwright install --with-deps chromium

      - name: Run Playwright
        working-directory: tests/e2e
        env:
          CI: 'true'
        run: npm test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e/playwright-report
          retention-days: 14

      - name: Capture wp-env debug.log
        if: failure()
        run: |
          npx --yes @wordpress/env run cli "cat wp-content/debug.log" > debug.log || true
          echo "--- end debug.log ---"

      - name: Upload debug.log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wp-debug-log
          path: debug.log
          if-no-files-found: ignore
